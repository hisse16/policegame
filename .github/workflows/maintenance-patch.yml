name: Apply investigation engine maintenance fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch story engine
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/services/story/storyEngine.ts')
          text = path.read_text(encoding='utf-8')

          old = """        step.trigger.targetId &&\n        (step.trigger.targetId.toLowerCase() === cleanId || cleanId.includes(step.trigger.targetId.toLowerCase())) &&\n        !this.state.discoveredStepIds.includes(step.id)"""
          new = """        step.trigger.targetId &&\n        step.trigger.targetId.toLowerCase().trim() === cleanId &&\n        !this.state.discoveredStepIds.includes(step.id)"""
          if old not in text:
              raise SystemExit('view_record trigger block not found')
          text = text.replace(old, new, 1)

          old = """        step.trigger.searchTerm &&\n        clean.includes(step.trigger.searchTerm.toLowerCase()) &&\n        !this.state.discoveredStepIds.includes(step.id)"""
          new = """        step.trigger.searchTerm &&\n        (() => {\n          const searchTerm = step.trigger.searchTerm.toLowerCase().trim();\n          if (!searchTerm) return false;\n          if (searchTerm.includes(' ')) return clean.includes(searchTerm);\n          return new RegExp(`\\\\b${searchTerm.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')}\\\\b`, 'i').test(clean);\n        })() &&\n        !this.state.discoveredStepIds.includes(step.id)"""
          if old not in text:
              raise SystemExit('search_term trigger block not found')
          text = text.replace(old, new, 1)

          old = """    // If 80% of current act is discovered, advance act if not at 6\n    if (discoveredInAct.length >= Math.ceil(actSteps.length * 0.8) && this.state.currentAct < 6) {"""
          new = """    // Acts normally require 80% discovery, but an explicit completion step\n    // (flag_act_N_completed) is always mandatory when one exists.\n    const completionStep = actSteps.find((step) => step.flagGranted === `flag_act_${this.state.currentAct}_completed`);\n    const completionDiscovered = !completionStep || this.state.discoveredStepIds.includes(completionStep.id);\n    const thresholdMet = discoveredInAct.length >= Math.ceil(actSteps.length * 0.8);\n\n    if (thresholdMet && completionDiscovered && this.state.currentAct < 6) {"""
          if old not in text:
              raise SystemExit('act progression block not found')
          text = text.replace(old, new, 1)

          old = """if (typeof window !== 'undefined') {\n  (window as any).storyEngine = storyEngine;\n}"""
          new = """if (typeof window !== 'undefined' && import.meta.env.DEV) {\n  (window as any).storyEngine = storyEngine;\n}"""
          if old not in text:
              raise SystemExit('storyEngine debug exposure block not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/maintenance-patch.yml
          git add src/services/story/storyEngine.ts .github/workflows/maintenance-patch.yml
          git commit -m "fix: harden story progression and triggers"
          git push
